<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archreg</title>
  <meta name="description" content="Check a building design against the detaljplan and Boverket's building rules, in the browser.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "maplibre-gl": "https://cdn.jsdelivr.net/npm/maplibre-gl@6.16.0/dist/maplibre-gl.mjs",
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
      "web-ifc": "https://cdn.jsdelivr.net/npm/web-ifc@0.0.78/web-ifc-api.js",
      "rhino3dm": "https://cdn.jsdelivr.net/npm/rhino3dm@8.35.0/rhino3dm.module.min.js"
    }
  }
  </script>
  <script src="wasm/wasm_exec.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="welcome" data-i18n="welcome">Welcome to</span>
      <span class="name">[App name]</span>
    </div>
    <form id="search" class="search" role="search">
      <input name="q" type="search" placeholder="Search address, place or coordinates" aria-label="Search address, place or coordinates" data-i18n-placeholder="search" data-i18n-aria="search"
        autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
      <ul id="suggest" class="suggest" role="listbox" aria-label="Suggestions" hidden></ul>
    </form>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="sv" aria-pressed="false" title="Svenska">SV</button>
      <button data-lang="en" aria-pressed="false" title="English">EN</button>
    </div>
    <button id="import" class="dark" data-i18n="import">Import design</button>
    <input id="file" type="file" accept=".ifc,.3dm" hidden>
  </header>

  <main class="layout">
    <aside class="side">
      <!-- Go renders the menu rail and the pane into #panel (display: contents). -->
      <div id="panel" class="side-grid"></div>
      <div id="askpane" class="askpane">
        <div id="chatbox" class="chatbox" hidden>
          <button type="button" id="chat-fold" class="chat-fold" aria-label="Hide answers" title="Hide answers" data-i18n-aria="hideAnswers" data-i18n-title="hideAnswers">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 9l6 6 6-6"/></svg>
          </button>
          <div id="chat" class="chat" aria-live="polite"></div>
        </div>
        <form id="ask" class="ask">
          <input name="q" placeholder="Ask, e.g. why does my window fail? What is e1?" autocomplete="off" aria-label="Ask a question" data-i18n-placeholder="askPlaceholder" data-i18n-aria="ask">
          <button type="submit" class="round" aria-label="Send" data-i18n-aria="send">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
          </button>
        </form>
      </div>
    </aside>

    <section class="stage" aria-label="Map and 3D view">
      <div class="seg" role="group" aria-label="View">
        <button data-view="map" aria-pressed="true" data-i18n="map">Map</button>
        <button data-view="map3d" aria-pressed="false" title="Tilted map with surrounding buildings, the plan's height limits and your model" data-i18n="map3d" data-i18n-title="map3dTitle">3D map</button>
        <button data-view="3d" aria-pressed="false" title="Look at the model on its own" data-i18n="model" data-i18n-title="modelTitle">Model</button>
      </div>
      <div id="map"></div>
      <div id="map-legend" class="map-legend" hidden>
        <span><i class="sw env"></i><span data-i18n="envLegend">Plan height limit</span></span>
        <span><i class="sw osm"></i><span data-i18n="osmLegend">Existing buildings</span></span>
        <p id="map-note" class="small" hidden></p>
      </div>
      <div id="viewer" hidden></div>
      <div id="loading" class="loading">Loading…</div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
