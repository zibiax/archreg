# Tests, then builds a multi-arch image (amd64, arm64, arm/v7 — so it runs on
# a Raspberry Pi) and pushes it to Docker Hub.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   your Docker Hub user
#   DOCKERHUB_TOKEN      a Docker Hub access token (Account settings → Personal access tokens)
#   LM_CLIENT_ID         optional: Lantmäteriet credentials. When set, real
#   LM_CLIENT_SECRET     detaljplaner are fetched and baked into the image.
# Repository variable (optional): IMAGE_NAME, default "archreg".
name: docker

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -o /tmp/app.wasm ./cmd/wasm

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      LM_CLIENT_ID: ${{ secrets.LM_CLIENT_ID }}
      LM_CLIENT_SECRET: ${{ secrets.LM_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch real detaljplaner (if credentials are set)
        if: env.LM_CLIENT_ID != '' && env.LM_CLIENT_SECRET != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: env.LM_CLIENT_ID != '' && env.LM_CLIENT_SECRET != ''
        run: go run ./cmd/fetch-plans

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.IMAGE_NAME || 'archreg' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
